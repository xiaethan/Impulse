; PlatformIO project for the CrowPanel 7.0 inch (DIS08070H).
; Live chart:        pio run -t upload
; Recorded playback: pio run -e crowpanel_7_replay -t upload

[platformio]
default_envs = crowpanel_7

[env:crowpanel_7]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/cu.usbserial-210
monitor_port = /dev/cu.usbserial-210

; ESP32-S3-WROOM-1-N4R8: 4 MB quad flash, 8 MB octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = default.csv

build_unflags =
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
build_src_filter = +<*> -<display_out_test.cpp>

lib_deps = lovyan03/LovyanGFX@^1.2.0

[env:crowpanel_7_replay]
extends = env:crowpanel_7
build_src_filter = +<*> -<display_out.cpp>
